[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "specterx"
version = "0.1.0"
description = "Portable, hardened Cloudflare Turnstile / challenge solver"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "lingxudr" }]
keywords = ["cloudflare", "turnstile", "captcha", "cdp", "automation", "stealth"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
]
dependencies = ["websockets>=12"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
specterx = "specterx.__main__:main"

[tool.setuptools.packages.find]
include = ["specterx*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
# Deliberate: browser-automation code must survive flaky CDP calls.
# Broad excepts around best-effort browser operations are a resilience
# pattern here, not sloppiness — a failed cookie read must never kill a solve.
ignore = ["BLE001", "S110", "S112"]

[tool.pytest.ini_options]
testpaths = ["tests/test_unit.py"]
